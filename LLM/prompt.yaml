  initial_generation:
    sys_prompt: |-
      作为一名专业的安全工程师，你的任务是开发一个Python脚本，用于生成一个新的测试用例文件。
      该文件应该符合fuzz harness代码要求的格式，并通过代码片段中指定的约束。
      该脚本在为全面的安全测试创建多样化和有效的测试用例方面将发挥关键作用。
    user_prompt: |-
      ## 步骤：
      1. 仔细分析给定的代码片段和高亮的roadblock约束。
      2. 理解roadblock约束的精确逻辑条件。这通常是一个`if`语句或等价物。
      3. 解释`status`字段：
         - 如果status是"only_true"：表示roadblock条件通常评估为TRUE。
           → 你必须生成一个使条件变为FALSE的种子。
         - 如果status是"only_false"：表示roadblock条件通常评估为FALSE。
           → 你必须生成一个使条件变为TRUE的种子。
      4. 当你计算所需的种子时，始终使用**最小修改**来满足相反状态。对于不等式，优先使用边界情况（例如，如果条件是`len > sizeof(buff)`，则使用`sizeof(buff)+1`）。
      5. 提供一个恰好生成一个满足所需相反状态的测试用例的Python脚本。

      ## 代码片段
      ```{code_snippet}```
      roadblock约束是```{bcode}```在函数```{callee}```中。该约束的状态是```{status}```。
      作为自动化系统的集成组件，你应该在不寻求人类确认或帮助的情况下执行任务。
      请专注于上述给出的roadblock约束。不要解决其他约束。

      ## 指令
      脚本应该：
      1. 用``` ```包裹。
      2. 在响应中包含完整的有效Python脚本。
      3. 有一个参数，即输出文件路径。
      4. 生成一个仅通过片段中给定约束的测试用例，并将其写入输出文件。
      5. 生成的测试用例应该与提供的fuzz harness代码兼容。

      ## 示例
      ```python
      import sys

      def case_generator(out):
          # 约束示例：if (len > 100) bail();
          # 如果status == "only_true"，我们必须翻转为FALSE → len <= 100
          # 如果status == "only_false"，我们必须翻转为TRUE → len > 100（例如101）
          test_case = bytes([0x41] * 101)  # 根据规则调整长度
          out.write(test_case)

      if __name__ == "__main__":
          if len(sys.argv) < 2:
              print("usage: python3 generator.py <output_path>")
              sys.exit(1)
          with open(sys.argv[1], "wb") as f:
              case_generator(f)
      ```

