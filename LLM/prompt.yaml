        },
        "global_merged_constraints_in_natural_language": ["输入必须满足前置解析条件"],
        "non_input_constraints": [
          {
            "type": "program_state",
            "description": "某些状态可能依赖更早的初始化逻辑"
          }
        ],
        "breakthrough_assessment": {
          "is_key_bottleneck": true,
          "worth_breaking_first": true,
          "can_be_broken_by_input_alone": false,
          "primary_blocker_type": "program_state",
          "recommended_action": "state_guided_generation"
        },
        "reasoning_summary": "该瓶颈有输入约束，但主障碍可能仍受程序状态影响。"
      }
