        `input_variables`, `per_function_constraints`, `target_branch`,
        `global_merged_constraints_in_natural_language`, `non_input_constraints`,
        `breakthrough_assessment`, `reasoning_summary`
      - `breakthrough_assessment` 必须包含：
        `is_key_bottleneck`, `worth_breaking_first`, `can_be_broken_by_input_alone`,
        `primary_blocker_type`, `recommended_action`
      - `primary_blocker_type` 只能是：
        `input | program_state | call_order | environment | resource | external_dependency | unknown`
      - `recommended_action` 只能是：
        `proceed_input_generation | state_guided_generation | change_target | defer_roadblock | need_more_information`

