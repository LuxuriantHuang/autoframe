  _crc_checksum_rules: |-
    ### CRC/校验和重算规则

    **常见格式的校验处理**：

    | 格式 | 校验类型 | 位置 | 重算方法 | Python库 |
    |------|---------|------|---------|---------|
    | PNG | CRC32 | 每个chunk末尾4字节 | zlib.crc32(type+data) | zlib |
    | OGG | CRC32 | 每页头部segment后 | 使用库自动处理 | pydub |
    | ZIP | CRC32 | 每个文件条目local file header | 使用zipfile库 | zipfile |
    | GZIP | CRC32 | 文件末尾8字节(未压缩CRC+大小) | 使用gzip库 | gzip |
    | ICC Profile | MD5 (可选) | 偏移84-99 | 可设为全0跳过 | - |
    | ELF | Checksum | section header | 可为0 | - |
    | TIFF | Strip/Tile | 内部 | 使用PIL库 | PIL |

    **PNG Chunk CRC 重算函数**：
    ```python
    import zlib

    def recalc_png_chunk_crc(buf, chunk_offset):
        """重算 PNG chunk 的 CRC。chunk_offset 指向 Length 字段起始位置"""
        length = int.from_bytes(buf[chunk_offset:chunk_offset+4], 'big')
        chunk_type = buf[chunk_offset+4:chunk_offset+8]
        chunk_data = buf[chunk_offset+8:chunk_offset+8+length]
        new_crc = zlib.crc32(chunk_type + chunk_data) & 0xffffffff
        crc_offset = chunk_offset + 8 + length
        return buf[:crc_offset] + new_crc.to_bytes(4, 'big') + buf[crc_offset+4:]
    ```

    **关键原则**：
    - 修改结构化字段后，必须检查是否需要重算校验
    - 优先使用领域库自动处理校验
    - 若无法使用库，按格式规范手动重算
    - 对于可选校验（如ICC Profile ID），可设为固定值跳过

  _structure_aware_mutation: |-
    ### 结构感知变异策略

    **按库分类的变异策略**：

    | 库名 | 关键偏移/结构 | 变异注意事项 |
    |------|------------|-------------|
    | libpng | IHDR: 16-28, Chunks: 8+length+4 | 修改chunk数据需重算CRC |
    | lcms | Header: 0-127, Tag表: 128+ | Tag偏移需4字节对齐 |
    | libxml | 文本格式，无固定偏移 | 使用lxml解析后修改更安全 |
    | libjpeg | 标记段: 0xFF+type+length+data | 熵编码段(SOS后)直接修改可能无效 |
    | sqlite3 | Header: 0-99, Pages: 1024/4096 | 页面有cell指针数组 |
    | zlib | 压缩流 + Adler-32 | 末尾4字节为校验 |
    | openssl/mbedtls | ASN.1 DER/PEM | TLV结构，长度需同步更新 |

    **通用变异规则**：
    - 使用 `struct.pack` 生成新字段值
    - 使用字节切片拼接: `buf[:off] + new_val + buf[off+len:]`
    - 多字节字段必须明确字节序 (little/big)
    - 位操作: 先读取、修改位、再写回

  _learned_mappings: |-
    ### 学习到的输入映射 (结构感知分析)

