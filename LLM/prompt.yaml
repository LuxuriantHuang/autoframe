            "state_combination": {{"state1": "value1", "state2": "value2"}},
            "feasibility": "high|medium|low",
            "requirements": ["需要的条件"]
          }}
        ],
        "recommendation": "综合建议"
      }}
      ```

      ## 重要提示

      - 如果存在不可解析的冲突，明确指出
      - 提供状态转换的最小路径
      - 考虑设置状态的顺序和依赖
      - 如果某些状态组合被文件格式禁止，说明原因
