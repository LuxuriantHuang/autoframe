  # ===========================================================================
  # 领域特定规则片段（不直接使用，由代码动态拼接）
  # 仅在特定库时启用对应的规则
  # ===========================================================================
  _domain_rules:
    lcms:
      structure: |-
        ### ICC Profile 结构说明（当前库为 lcms）

        ICC Profile 是色彩管理中使用的标准文件格式，用于描述设备的色彩特性。

        **文件结构**：
        - **Header (128 bytes)**：包含魔数、版本、颜色空间类型、设备类别等元信息
        - **Tag Table**：紧跟 Header，每个 tag 目录项 12 bytes (signature 4B + offset 4B + size 4B)
        - **Tag Data**：实际的色彩数据，可能是曲线、矩阵、查找表等

        **Header 完整字段（128 bytes，所有多字节字段 big-endian）**：
        | 偏移 | 大小 | 字段名 | 说明 |
        |------|------|--------|------|
        | 0-3 | 4 | CMM Type | CMM 标识符签名 |
        | 4-7 | 4 | Version | Profile 版本 (如 0x04400000 表示 v4.4, 0x02400000 表示 v2.4) |
        | 8-11 | 4 | Device Class | 设备/Profile 类别签名 |
        | 12-15 | 4 | Color Space of Data | 数据颜色空间签名 |
        | 16-19 | 4 | Profile Connection Space (PCS) | PCS 空间签名 |
        | 20-23 | 4 | Date/Time Year | 创建年份 (u16be) + 月 (u8) + 日 (u8) |
        | 24-27 | 4 | Date/Time Time | 时 (u8) + 分 (u8) + 秒 (u8) + 保留 |
        | 28-35 | 8 | Profile File Signature | 魔数 "acsp" (0x61637370) + 保留 |
        | 36-39 | 4 | Primary Platform | 主平台签名 |
        | 40-43 | 4 | Profile Flags | Profile 标志位 |
        | 44-47 | 4 | Device Manufacturer | 设备制造商签名 |
        | 48-51 | 4 | Device Model | 设备型号签名 |
        | 52-55 | 4 | Device Attributes | 设备属性 (8 bytes 高 4B + 低 4B) |
        | 56-63 | 8 | Device Attributes | 设备属性 (续) |
        | 64-67 | 4 | Rendering Intent | 渲染意图 |
        | 68-79 | 12 | PCS Illuminant | D50 白点 XYZ (每个 s15Fixed16Number 4B) |
        | 80-83 | 4 | Profile Creator | Profile 创建者签名 |
        | 84-99 | 16 | Profile ID | MD5 校验和 |
        | 100-127 | 28 | Reserved | 保留字节 (必须为 0) |

        **颜色空间签名（Color Space Signatures, big-endian 4-byte）**：
        | 名称 | 签名值 | ASCII | 说明 |
        |------|--------|-------|------|
        | nCI2 | 0x6E434932 | "nCI2" | 2-channel colorant |
        | nCLR | 0x6E434C52 | "nCLR" | n-channel color |
        | GRAY | 0x47524159 | "GRAY" | 灰度 |
        | RGB  | 0x52474220 | "RGB " | RGB |
        | HSV  | 0x48535620 | "HSV " | HSV |
        | HLS  | 0x484C5320 | "HLS " | HLS |
        | CMYK | 0x434D594B | "CMYK" | CMYK |
        | CMY  | 0x434D5920 | "CMY " | CMY |
        | Lab  | 0x4C616220 | "Lab " | CIE Lab |
        | Luv  | 0x4C757620 | "Luv " | CIE Luv |
        | XYZ  | 0x58595A20 | "XYZ " | XYZ |
        | ycbr | 0x79636272 | "ycbr" | YCbCr |
        | 2CLR | 0x32434C52 | "2CLR" | 2-color |
        | 3CLR | 0x33434C52 | "3CLR" | 3-color |
        | 4CLR | 0x34434C52 | "4CLR" | 4-color |
        | 5CLR | 0x35434C52 | "5CLR" | 5-color |
        | 6CLR | 0x36434C52 | "6CLR" | 6-color |
        | 7CLR | 0x37434C52 | "7CLR" | 7-color |
        | 8CLR | 0x38434C52 | "8CLR" | 8-color |
        | 9CLR | 0x39434C52 | "9CLR" | 9-color |
        | ACRL | 0x4143524C | "ACRL" | ACRL |
        | Lab5 | 0x4C616235 | "Lab5" | Lab5 |
        | Lab6 | 0x4C616236 | "Lab6" | Lab6 |
        | mc02 | 0x6D633032 | "mc02" | mc02 |
        | mc03 | 0x6D633033 | "mc03" | mc03 |
        | mc04 | 0x6D633034 | "mc04" | mc04 |
        | mc05 | 0x6D633035 | "mc05" | mc05 |
        | mc06 | 0x6D633036 | "mc06" | mc06 |
        | mc07 | 0x6D633037 | "mc07" | mc07 |
        | mc08 | 0x6D633038 | "mc08" | mc08 |
        | mc09 | 0x6D633039 | "mc09" | mc09 |
        | mc10 | 0x6D633130 | "mc10" | mc10 |
        | mc11 | 0x6D633131 | "mc11" | mc11 |
        | mc12 | 0x6D633132 | "mc12" | mc12 |
        | mc13 | 0x6D633133 | "mc13" | mc13 |
        | mc14 | 0x6D633134 | "mc14" | mc14 |
        | mc15 | 0x6D633135 | "mc15" | mc15 |
        | nmcl | 0x6E6D636C | "nmcl" | n-channel |

        **设备类别签名（Profile/Device Class Signatures）**：
        | 名称 | 签名值 | ASCII | 说明 |
        |------|--------|-------|------|
        | abst | 0x61627374 | "abst" | Abstract Profile |
        | link | 0x6C696E6B | "link" | Device Link Profile |
        | mntr | 0x6D6E7472 | "mntr" | Monitor Profile |
        | nmcl | 0x6E6D636C | "nmcl" | Named Color Profile |
        | prtr | 0x70727472 | "prtr" | Printer Profile |
        | scnr | 0x73636E72 | "scnr" | Scanner Profile |
        | spac | 0x73706163 | "spac" | Color Space Profile |
        | cidv | 0x63696476 | "cidv" | CIDV Profile |
        | cmap | 0x636D6170 | "cmap" | Colorimetric Device Model |
        | mdir | 0x6D646972 | "mdir" | Multiplex Directory Profile |
        | mlnk | 0x6D6C6E6B | "mlnk" | Multiplex Link Profile |
        | mvis | 0x6D766973 | "mvis" | Multiplex Visualization Profile |
        | nkpf | 0x6E6B7066 | "nkpf" | Nikon Input Scanner Profile |

        **渲染意图（Rendering Intent）**：
        | 值 | 说明 |
        |----|------|
        | 0 | Perceptual (感知) |
        | 1 | Media-Relative Colorimetric (相对色度) |
        | 2 | Saturation (饱和度) |
        | 3 | ICC-Absolute Colorimetric (绝对色度) |

        **PCS 空间签名**：
        | 名称 | 签名值 | 说明 |
        |------|--------|------|
        | XYZ | 0x58595A20 | "XYZ " - PCS XYZ |
        | Lab | 0x4C616220 | "Lab " - PCS Lab |

        **Tag 表项结构（每项 12 bytes）**：
        | 偏移 | 大小 | 字段 | 说明 |
        |------|------|------|------|
        | 0-3 | 4 | Tag Signature | Tag 类型签名 |
        | 4-7 | 4 | Data Offset | 数据偏移 (从文件开头) |
        | 8-11 | 4 | Data Size | 数据大小 (bytes) |

        **常见 Tag 签名**：
        | 名称 | 签名 | 说明 |
        |------|------|------|
        | desc | "desc" | Profile 描述 |
        | wtpt | "wtpt" | 媒体白点 |
        | bkpt | "bkpt" | 媒体黑点 |
        | cprt | "cprt" | 版权信息 |
        | rXYZ | "rXYZ" | 红色 XYZ 三刺激值 |
        | gXYZ | "gXYZ" | 绿色 XYZ 三刺激值 |
        | bXYZ | "bXYZ" | 蓝色 XYZ 三刺激值 |
        | rTRC | "rTRC" | 红色色调响应曲线 |
        | gTRC | "gTRC" | 绿色色调响应曲线 |
        | bTRC | "bTRC" | 蓝色色调响应曲线 |
        | kTRC | "kTRC" | 黑色色调响应曲线 |
        | A2B0 | "A2B0" | Device to PCS: Intent 0 |
        | A2B1 | "A2B1" | Device to PCS: Intent 1 |
        | A2B2 | "A2B2" | Device to PCS: Intent 2 |
        | B2A0 | "B2A0" | PCS to Device: Intent 0 |
        | B2A1 | "B2A1" | PCS to Device: Intent 1 |
        | B2A2 | "B2A2" | PCS to Device: Intent 2 |
        | clro | "clro" | 颜色排序顺序 |
        | ctrl | "ctrl" | 灰度图像控制 |

        **关键约束**：
        1. 魔数必须是 "acsp" (0x61637370) 在偏移 36-39
        2. Tag 偏移必须 4 字节对齐
        3. 颜色空间类型决定后续 tag 的解析方式
        4. PCS 通常为 XYZ 或 Lab
        5. Header 总大小固定为 128 bytes

      state_variables: |-
        ### LCMS 状态变量到输入偏移的映射

        lcms 代码中的内部状态变量通过解析 ICC Profile 输入来设置。当分析代码约束时，
        如果遇到以下状态变量，可以通过修改 ICC Profile header 的对应字节来满足约束：

        **核心状态变量映射表**：

        | 状态变量 | 代码中表示 | Header 偏移 | 大小 | 编码 | 取值示例 |
        |---------|-----------|------------|------|------|----------|
        | DeviceClass | profile->DevClass / DeviceClass | 12-15 | 4B | u32be | mntr=0x6D6E7472, prtr=0x70727472 |
        | ColorSpace | profile->ColorSpace / ColorSpace | 16-19 | 4B | u32be | RGB=0x52474220, LAB=0x4C414220 |
        | PCS | profile->PCS / PCS | 20-23 | 4B | u32be | XYZ=0x58595A20, Lab=0x4C616220 |
        | RenderingIntent | profile->RenderingIntent | 64-67 | 4B | u32be | 0=perceptual, 1=relative |
        | Version | profile->Version | 4-7 | 4B | u32be | 0x02400000=v2.4, 0x04400000=v4.4 |
        | ProfileFlags | profile->flags | 40-43 | 4B | u32be | 各位有不同含义 |

        **常见代码模式及其输入约束转换**：

        1. **颜色空间检查**
           ```c
           if (profile->ColorSpace == PT_RGB)  // PT_RGB 是内部枚举
           ```
           → 转换为：bytes[16:20] 必须是 0x52474220 ("RGB" big-endian)

        2. **设备类别检查**
           ```c
           if (cmsGetDeviceClass(hProfile) == cmsSigDisplayClass)  // mntr
           ```
           → 转换为：bytes[12:16] 必须是 0x6D6E7472 ("mntr" big-endian)

        3. **PCS 空间检查**
           ```c
           if (profile->PCS == cmsSigXYZData)
           ```
           → 转换为：bytes[20:24] 必须是 0x58595A20 ("XYZ" big-endian)

        4. **组合条件**
           ```c
           int lIsInput = (PostColorSpace != cmsSigXYZData) &&
                          (PostColorSpace != cmsSigLabData);
           ```
           → 转换为：bytes[16:20] 和 bytes[20:24] 不能是 XYZ 或 Lab 的签名值

        **状态变量派生关系**：

        ```
        输入 ICC Profile
            ↓
        cmsOpenProfileFromMem() 解析 header
            ↓
        设置内部状态: DevClass, ColorSpace, PCS, RenderingIntent
            ↓
        cmsCreateTransform() 根据状态决定 lIsInput
            ↓
        cmsDoTransform() 根据状态选择转换路径
        ```

        **关键理解**：
        - 许多看似复杂的分支条件实际上依赖于从输入解析得到的状态
        - 识别 `profile->` 前缀的变量，它们通常来自 ICC Profile header
        - 状态到输入的映射是确定性的：修改特定偏移的字节即可改变状态

      conflict_rules: |-
        ### LCMS 领域特定冲突检测规则

        在判断约束冲突时，以下情况**不应判定为冲突**：

        1. **不同颜色空间的分支路径**
           - 示例：一个约束要求 RGB 颜色空间，另一个要求 LAB
           - 原因：可以构造特定颜色空间的 ICC Profile，不同路径使用不同 profile
           - 处理：选择其中一个颜色空间构造 profile

        2. **Tag 类型约束不同**
           - 示例：一个约束涉及 rTRC tag，另一个涉及 gTRC tag
           - 原因：ICC Profile 可以同时包含多个不同类型的 tag
           - 处理：在 profile 中包含所有需要的 tag

        3. **不同 Tag 目录项的约束**
           - 示例：tag A 的偏移约束 vs tag B 的偏移约束
           - 原因：Tag 表中可以包含多个独立的 tag 目录项
           - 处理：为每个 tag 设置独立的偏移和大小

        4. **约束来自不同处理阶段**
           - 示例：解析阶段约束 (cmsOpenProfileFromMem) vs 转换阶段约束 (cmsDoTransform)
           - 原因：不同阶段的约束可能需要分步满足
           - 处理：尝试构造满足所有阶段约束的输入

        5. **内部状态变量约束**
           - 示例：`profile->ColorSpace == RGB`、`profile->DevClass == mntr`、`hProfile->PCS`
           - 原因：这些状态通过输入解析设置，可通过修改 ICC Profile header 字段满足
           - 处理：修改对应的 header 字段：
             - ColorSpace: 偏移 16-19 (4 bytes, big-endian)
             - DevClass: 偏移 12-15 (4 bytes, big-endian)
             - PCS: 偏移 20-23 (4 bytes, big-endian)

        6. **渲染意图约束**
           - 示例：不同的 Rendering Intent 值 (0-3)
           - 原因：可以设置不同的渲染意图值
           - 处理：修改 header 偏移 64-67 的值

        7. **Profile 版本约束**
           - 示例：版本 v2 vs v4
           - 原因：可以构造不同版本的 profile
           - 处理：修改 header 偏移 8-11 的版本字段

        **应判定为冲突的情况**：

        1. **同一 Header 字段的矛盾值**
           - 示例：ColorSpace 必须是 RGB (0x52474220) 且 ColorSpace 必须是 LAB (0x4C414220)
           - 原因：同一 profile 的 header 中每个字段只能有一个值
           - 字段偏移速查：
             - DevClass: 偏移 12-15
             - ColorSpace: 偏移 16-19
             - PCS: 偏移 20-23
             - RenderingIntent: 偏移 64-67

        2. **结构约束违反**
           - 示例：文件大小小于 header 大小 (128 bytes)
           - 原因：违反 ICC Profile 规范的基本要求

        3. **魔数约束冲突**
           - 示例：魔数必须是 "acsp" (0x61637370) 且魔数必须是其他值
           - 原因：魔数是固定的，位于偏移 36-39

        4. **无效的颜色空间与 PCS 组合**
           - 示例：ColorSpace = RGB 但 PCS = 无效值
           - 原因：PCS 必须是 "XYZ " (0x58595A20) 或 "Lab " (0x4C616220)

        5. **Tag 偏移对齐冲突**
           - 示例：Tag 偏移必须 4 字节对齐，但约束要求的偏移不是 4 的倍数
           - 原因：ICC Profile 规范要求所有 Tag 数据 4 字节对齐

    libpng:
      structure: |-
        ### PNG 结构说明（当前库为 libpng）

        PNG (Portable Network Graphics) 是一种无损压缩的图像格式，支持 APNG 动画扩展。

        **文件结构**：
        - **PNG Signature (8 bytes)**：0x89 0x50 0x4E 0x47 0x0D 0x0A 0x1A 0x0A
        - **IHDR Chunk**：图像头信息，必须第一个出现
        - **Other Chunks**：PLTE, IDAT, IEND 及各种辅助 chunks

        **Chunk 通用结构**：
        | 字段 | 大小 | 说明 |
        |------|------|------|
        | Length | 4 bytes (BE) | Data 字段长度 |
        | Type | 4 bytes ASCII | Chunk 类型标识 |
        | Data | Length bytes | Chunk 数据 |
        | CRC | 4 bytes | CRC32 校验 |

        **IHDR Chunk（图像头，13 bytes data）**：
        | 偏移 | 大小 | 字段 | 说明 |
        |------|------|------|------|
        | 0-3 | 4 | Width | 图像宽度 (big-endian) |
        | 4-7 | 4 | Height | 图像高度 (big-endian) |
        | 8 | 1 | Bit Depth | 位深度 |
        | 9 | 1 | Color Type | 颜色类型 |
        | 10 | 1 | Compression | 压缩方法 (必须为 0) |
        | 11 | 1 | Filter | 滤波方法 (必须为 0) |
        | 12 | 1 | Interlace | 隔行扫描方法 |

        **颜色类型（Color Type）**：
        | 值 | 名称 | 说明 |
        |----|------|------|
        | 0 | Greyscale | 灰度图像 |
        | 2 | Truecolor | RGB 真彩色 |
        | 3 | Indexed | 索引颜色 (需 PLTE) |
        | 4 | Greyscale Alpha | 灰度 + Alpha |
        | 6 | Truecolor Alpha | RGBA |

        **位深度与颜色类型有效组合**：
        | Color Type | 有效 Bit Depth |
        |------------|----------------|
        | 0 (Greyscale) | 1, 2, 4, 8, 16 |
        | 2 (Truecolor) | 8, 16 |
        | 3 (Indexed) | 1, 2, 4, 8 |
        | 4 (Greyscale Alpha) | 8, 16 |
        | 6 (Truecolor Alpha) | 8, 16 |

        **隔行扫描（Interlace Method）**：
        | 值 | 说明 |
        |----|------|
        | 0 | 无隔行 (No interlace) |
        | 1 | Adam7 隔行 |

        **PLTE Chunk（调色板）**：
        - 每个条目 3 bytes: R, G, B
        - 条目数量: 1-256
        - 仅对 Color Type 3 必需，对其他类型可选

        **关键 Chunks（必须正确处理）**：
        | Type | 说明 |
        |------|------|
        | IHDR | 图像头，必须第一个 |
        | PLTE | 调色板 (Color Type 3 必需) |
        | IDAT | 图像数据 (zlib 压缩) |
        | IEND | 图像结束，必须最后一个 |

        **辅助 Chunks**：

        *颜色/色彩空间信息*：
        | Type | 数据结构 | 说明 |
        |------|----------|------|
        | cHRM | 8 x u32be | CIE 色度坐标 (白点 + RGB) |
        | gAMA | u32be | Gamma 值 (乘以 100000) |
        | iCCP | 变长 | 内嵌 ICC Profile |
        | sBIT | 变长 | 有效位深度 |
        | sRGB | u8 | 标准RGB色彩空间渲染意图 |

        *sRGB 渲染意图值*：
        | 值 | 说明 |
        |----|------|
        | 0 | Perceptual (感知) |
        | 1 | Relative Colorimetric (相对色度) |
        | 2 | Saturation (饱和度) |
        | 3 | Absolute Colorimetric (绝对色度) |

        *背景/透明*：
        | Type | 说明 |
        |------|------|
        | bKGD | 背景色 (格式取决于 Color Type) |
        | tRNS | 透明信息 (格式取决于 Color Type) |
        | hIST | 调色板直方图 |

        *物理尺寸*：
        | Type | 数据结构 | 说明 |
        |------|----------|------|
        | pHYs | u32be + u32be + u8 | X/Y 像素/单位 + 单位类型 |

        *pHYs 单位类型*：
        | 值 | 说明 |
        |----|------|
        | 0 | 未知单位 |
        | 1 | 米 (meter) |

        *时间戳*：
        | Type | 数据结构 | 说明 |
        |------|----------|------|
        | tIME | u16be + 5 x u8 | Year, Month, Day, Hour, Minute, Second |

        *文本信息*：
        | Type | 说明 |
        |------|------|
        | tEXt | 未压缩文本 (keyword + text) |
        | zTXt | zlib 压缩文本 |
        | iTXt | 国际化文本 (UTF-8, 可压缩) |

        **APNG 动画扩展 Chunks**：

        *acTL (Animation Control)*：
        | 偏移 | 大小 | 字段 | 说明 |
        |------|------|------|------|
        | 0-3 | 4 | num_frames | 帧数 |
        | 4-7 | 4 | num_plays | 循环次数 (0=无限) |

        *fcTL (Frame Control, 26 bytes)*：
        | 偏移 | 大小 | 字段 | 说明 |
        |------|------|------|------|
        | 0-3 | 4 | sequence_number | 序列号 |
        | 4-7 | 4 | width | 帧宽度 |
        | 8-11 | 4 | height | 帧高度 |
        | 12-15 | 4 | x_offset | X 偏移 |
        | 16-19 | 4 | y_offset | Y 偏移 |
        | 20-21 | 2 | delay_num | 延迟分子 |
        | 22-23 | 2 | delay_den | 延迟分母 |
        | 24 | 1 | dispose_op | 处理操作 |
        | 25 | 1 | blend_op | 混合操作 |

        *dispose_op 值*：
        | 值 | 说明 |
        |----|------|
        | 0 | APNG_DISPOSE_OP_NONE - 不处理 |
        | 1 | APNG_DISPOSE_OP_BACKGROUND - 清除为透明 |
        | 2 | APNG_DISPOSE_OP_PREVIOUS - 恢复上一帧 |

        *blend_op 值*：
        | 值 | 说明 |
        |----|------|
        | 0 | APNG_BLEND_OP_SOURCE - 替换 |
        | 1 | APNG_BLEND_OP_OVER - 混合 |

        *fdAT (Frame Data)*：
        | 偏移 | 大小 | 字段 | 说明 |
        |------|------|------|------|
        | 0-3 | 4 | sequence_number | 序列号 |
        | 4+ | 变长 | frame_data | 帧数据 |

        **关键约束**：
        1. 文件必须以 PNG 签名开头 (0x89 0x50 0x4E 0x47 0x0D 0x0A 0x1A 0x0A)
        2. IHDR 必须是第一个 chunk
        3. IEND 必须是最后一个 chunk
        4. CRC 校验必须正确 (CRC32)
        5. 颜色类型和位深度的组合必须有效
        6. IDAT 数据使用 zlib 压缩
        7. PLTE 对 Color Type 3 是必需的

      conflict_rules: |-
        ### libpng 领域特定冲突检测规则

        在判断约束冲突时，以下情况**不应判定为冲突**：

        1. **不同 chunk 的约束**
           - 示例：一个约束涉及 IHDR，另一个涉及 PLTE，还有一个涉及 gAMA
           - 原因：PNG 可以包含多个 chunk，不同 chunk 的约束可以同时满足
           - 处理：构造包含所有需要 chunk 的 PNG

        2. **图像尺寸约束（不同尺寸范围）**
           - 示例：width > 100 且 width < 1000
           - 原因：可以构造满足范围内的任意尺寸
           - 处理：选择同时满足所有约束的尺寸值

        3. **不同辅助 chunk 的存在**
           - 示例：一个路径需要 sRGB chunk，另一个需要 gAMA chunk
           - 原因：可以同时包含多个辅助 chunk
           - 处理：在 PNG 中包含所有需要的辅助 chunk

        4. **隔行扫描模式**
           - 示例：interlace=0 vs interlace=1
           - 原因：可以设置不同的隔行模式
           - 处理：选择满足特定约束的隔行模式（如果约束矛盾才冲突）

        5. **APNG 帧相关约束**
           - 示例：不同帧的 fcTL 约束
           - 原因：APNG 可以包含多帧，每帧有独立的控制信息
           - 处理：为每帧设置独立的控制参数

        6. **内部状态变量约束**
           - 示例：`png_ptr->color_type`、`png_ptr->bit_depth`、`png_ptr->interlaced`
           - 原因：这些状态通过解析 IHDR 设置，可通过修改 IHDR 字段满足
           - 处理：修改 IHDR 中对应的字段

        **应判定为冲突的情况**：

        1. **同一 IHDR 字段的矛盾值**
           - 示例：color_type 必须是 2 (RGB) 且 color_type 必须是 6 (RGBA)
           - 原因：IHDR 中每个字段只能有一个值

        2. **无效的颜色类型和位深度组合**
           - 示例：color_type=3 (索引) 且 bit_depth=16
           - 原因：索引颜色只支持 1/2/4/8 位深度，不支持 16 位
           - 无效组合速查：
             - Color Type 3 + bit_depth=16
             - Color Type 2/4/6 + bit_depth=1/2/4
             - Color Type 0 + bit_depth=任意非 1/2/4/8/16

        3. **固定值字段约束冲突**
           - 示例：compression 必须是 0 且 compression 必须是 1
           - 原因：compression 和 filter 字段在 PNG 规范中固定为 0

        4. **Chunk 顺序约束冲突**
           - 示例：PLTE 必须在 IDAT 前且 PLTE 必须在 IDAT 后
           - 原因：Chunk 顺序是固定的 (IHDR -> PLTE -> IDAT -> IEND)

        5. **CRC 校验冲突**
           - 示例：CRC 必须等于 A 且 CRC 必须等于 B (A != B)
           - 原因：每个 chunk 的 CRC 由其内容唯一决定
           - 注意：CRC 约束通常不应与数据约束同时存在
