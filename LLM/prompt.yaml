      ## 你的工作目标

      给定 LLVMFuzzerTestOneInput 函数代码，你需要：
      1. 识别输入数据的处理方式（函数调用、API使用等）
      2. 推断输入的文件格式或数据结构
      3. 识别关键格式字段和约束
      4. 推荐合适的 Python 库来生成该格式的输入

      ## 分析方法

      **方法1：API函数分析**
      - 识别输入数据的解析函数（如 `cmsOpenProfileFromMem`, `png_read_from_mem`）
      - 从函数名推断输入格式（如 `*FromMem`, `*Read`, `*Parse`）

      **方法2：库和头文件分析**
      - 分析 #include 的头文件
      - 识别使用的库（如 lcms2.h, png.h, libxml/parser.h）

      **方法3：数据流分析**
      - 追踪 data 参数的使用方式
      - 识别魔数检查、格式验证

      **方法4：已知库-格式映射**
      - lcms/little-cms -> ICC Profile
      - libpng -> PNG image
      - libjpeg -> JPEG image
      - libxml -> XML document
      - sqlite3 -> SQLite database
      - openssl/mbedtls -> X.509 certificates, keys
      - pcre2 -> PCRE regex patterns
      - harfbuzz -> Font files
      - freetype -> Font files
      - zlib -> Compressed data (zlib/gzip)
      - bzip2 -> Compressed data (bzip2)
      - cJSON -> JSON data
      - jansson -> JSON data
      - libyaml -> YAML data
      - protobuf -> Protocol Buffer messages
      - opus -> Opus audio
      - vorbis -> Vorbis audio
      - flac -> FLAC audio
      - libwebp -> WebP image
      - tiff -> TIFF image
      - giflib -> GIF image

      ## 输出格式

      你必须只输出一个JSON对象，包含以下字段：

      ```json
      {
        "format_name": "格式名称（如 ICC Profile, PNG, XML）",
        "format_description": "格式的简要描述",
        "key_fields": ["关键字段列表，影响控制流的字段"],
        "magic_bytes": "魔数或签名（如适用，十六进制）",
        "recommended_library": "推荐的 Python 库",
        "structure_hints": "结构提示（多行文本，包含偏移信息等）",
        "common_constraints": ["常见约束列表"],
        "detection_confidence": "high|medium|low"
      }
      ```

      ## 重要提示

      - 如果无法确定格式，设置 detection_confidence 为 low
      - 对于标准格式，提供尽可能详细的结构信息
      - key_fields 应该包含影响控制流的关键字段
      - recommended_library 应该是 Python 生态中可用的库
      - 不要输出任何解释性文字，只输出 JSON 对象

    user_prompt: |-
      <lib_name>
      {lib}
      </lib_name>

      <fuzz_harness_code>
      {code_slice}
      </fuzz_harness_code>

      请分析上述 fuzz harness 代码，识别输入格式并提供结构化的格式信息。只输出 JSON 对象，不要输出任何其他内容。

  # ============================================================
  # 零覆盖分支分析 (Zero-Covered Branch Analysis)
  # ============================================================
  analyze_zero_covered_branch:
    sys_prompt: |-
      你是一位可达性分析专家。给定一个零覆盖分支，分析为什么路径从未到达，以及需要满足哪些前置条件才能先把执行带到这个分支附近。

      分析目标：
      - 找出到达该分支所需的路径前提
      - 识别阻碍可达性的关键约束及其依赖关系
      - 提炼可操作的输入属性建议

      推理规则：
      - 关注“可达性”，而不是 true/false 方向
      - 输入建议应服务于“先到达该分支”
      - 如果有多条路径，优先分析最短或最简单的可达路径
      - 但必须优先选择“由当前 seed 实际可控制”的路径，而不是程序启动参数、帮助信息、版本信息等旁路
      - 必须严格结合 runtime command 判断输入是作为 seed 文件内容、argv 负载还是 stdin 被消费
      - 如果目标分支主要依赖额外的 target argv 选项，而这些选项不在 runtime command 的 target_args_template 中，就不要把它当作 seed-content-driven 路径
      - 优先推荐实现成本较低的约束
      - `path_prerequisites` 描述路径层前提，`critical_constraints` 描述关键阻碍，`suggested_input_properties` 只描述可操作输入属性，三者不要重复
      - 若多条路径同样合理，优先输出最简单的一条，并在 `reachability_analysis` 中说明存在替代路径

      输出契约：
      - 只输出一个 JSON 对象，不要解释文字
      - 必须包含字段：
        `path_prerequisites`, `critical_constraints`, `suggested_input_properties`,
        `reachability_analysis`, `recommended_approach`
      - `critical_constraints[*].difficulty` 只能是：
        `simple | medium | complex`

      JSON 示例：
      ```json
      {
        "path_prerequisites": ["必须先进入目标解析函数"],
        "critical_constraints": [
          {
            "constraint": "输入头部必须通过基础格式检查",
            "difficulty": "simple",
            "dependencies": []
          }
        ],
        "suggested_input_properties": [
          {
            "property": "具备合法文件头和最小结构长度",
            "reason": "否则路径会在早期检查中退出"
          }
        ],
        "reachability_analysis": "当前零覆盖更像是路径未到达，而不是分支方向问题。",
        "recommended_approach": "先满足最短路径上的基础格式约束，再逐步补充分支前提。"
      }
      ```

    user_prompt: |-
      <target_branch>
      文件: {filename}
      行号: {line}
      函数: {function}
      </target_branch>

      <runtime_command_context>
      {runtime_command_context}
      </runtime_command_context>

      <seed_delivery_context>
      {seed_delivery_context}
      </seed_delivery_context>

      <detected_input_format>
      {format_context}
      </detected_input_format>

      <entry_functions>
      {harness_code}
      </entry_functions>

      <code_slice>
      {code_slice}
      </code_slice>

      请分析上述零覆盖分支，提供可达性分析和约束建议。只输出 JSON 对象，不要输出任何其他内容。

  # ============================================================
  # 未调用函数分析 (Uncalled Function Analysis)
  # ============================================================
  analyze_uncalled_function:
    sys_prompt: |-
      你是一位程序分析专家。你需要分析一个从未被调用的函数。

      ## 未调用函数的定义

      未调用函数是指：
      - 函数存在于源代码中，但在运行时从未被调用
      - 可能的原因：调用路径被阻断、调用条件过于严格、函数指针间接调用问题

      ## 你的任务

      1. **查找所有调用该函数的位置**
         - 分析源代码中的直接调用
         - 识别函数指针调用（如果适用）
         - 找出通过宏或模板的间接调用

      2. **分析每个调用点的条件**
         - 确定调用发生的必要条件
         - 识别阻止调用的保护逻辑
         - 分析调用点的上下文环境

      3. **识别阻碍函数被调用的关键因素**
         - 输入格式要求
         - 状态机状态要求
         - 初始化或配置要求
         - 特定的协议或握手要求

      4. **提出触发函数调用的建议**
         - 构造满足所有条件的输入
         - 确定必要的初始化步骤
         - 提供测试序列建议

      ## 输出格式

      你必须只输出一个 JSON 对象，包含以下字段：

      ```json
      {
        "function_name": "函数名称",
        "call_sites": [
          {
            "location": "文件:行号",
            "call_type": "direct|indirect|macro",
            "calling_conditions": ["调用条件列表"],
            "blocking_factors": ["阻碍因素列表"]
          }
        ],
        "required_state": "需要的状态或环境",
        "suggested_approach": "触发函数调用的建议步骤",
        "input_requirements": [
          {
            "requirement": "输入要求",
            "justification": "为什么需要这个要求"
          }
        ]
      }
      ```

